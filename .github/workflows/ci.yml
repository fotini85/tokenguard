name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Formatting
        run: |
          out=$(gofmt -l ./cmd ./internal)
          if [ -n "$out" ]; then
            echo "not formatted:"; echo "$out"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # The race detector is the point of this job. Without -race the
      # tests pass even with the mutexes removed: a data race does not
      # have to produce a wrong answer, only an undefined one.
      - name: Test with race detector
        run: go test -race -count=1 ./...

      # Compiles the benchmarks and runs each once, so a broken one is
      # caught here rather than the next time someone wants numbers.
      - name: Benchmarks compile
        run: go test -run '^$' -bench . -benchtime 1x ./...